name: Quizer Live Stream

on:
  workflow_dispatch:

jobs:
  stream:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - name: Tayyorlov (Pillow)
        run: |
          ffmpeg -version | head -1
          fc-list | grep -ci dejavu || true
          pip install --quiet pillow

      - name: SSH kalit
        run: |
          echo "${{ secrets.SSH_KEY }}" > key.pem
          chmod 600 key.pem

      - name: Efir
        env:
          RTMP_PUSH: ${{ secrets.RTMP_PUSH }}
          SSH_KEY_PATH: key.pem
          SSH_TARGET: ${{ secrets.SSH_TARGET }}
        run: python3 stream_gh.py
