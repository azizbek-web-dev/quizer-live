name: Quizer Live Stream

on:
  workflow_dispatch:

jobs:
  stream:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - name: Tayyorlov (ffmpeg static)
        run: |
          curl -sL https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz -o /tmp/ff.tar.xz
          tar -xJf /tmp/ff.tar.xz -C /tmp
          sudo cp /tmp/ffmpeg-master-*/bin/ffmpeg /usr/local/bin/
          ffmpeg -version | head -1

      - name: SSH kalit
        run: |
          echo "${{ secrets.SSH_KEY }}" > key.pem
          chmod 600 key.pem

      - name: Efir
        env:
          RTMP_PUSH: ${{ secrets.RTMP_PUSH }}
          SSH_KEY_PATH: key.pem
          SSH_TARGET: ${{ secrets.SSH_TARGET }}
        run: python3 playlist_stream.py
